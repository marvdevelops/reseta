<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .tinta { fill: var(--tinta); } .ink { fill: var(--ink); } .hl { fill: var(--highlighter); } .soft { fill: var(--tinta-soft); } .paper { fill: var(--paper); }
  .r-lg { rx: var(--radius-lg); }
  .name { position: absolute; left: 40px; bottom: 64px; margin: 0; font-family: var(--font-sans); font-weight: 700; font-size: 120px; line-height: .92; letter-spacing: -0.02em; color: var(--ink); }
  .tag { position: absolute; left: 44px; bottom: 32px; margin: 0; max-width: 440px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: tinta slab 264x240 (radius-lg), ink 152x112 (radius-lg), highlighter pill 176x56 (radius-pill, bleeds right), tinta-soft 176x64 (bleeds right and bottom)
    arrangement: one tall slab with satellites stacked on its right, the last two bleeding off the edge, all right of x = 480
    pattern: a literal motif: the ruled lines of a prescription pad, as paper-coloured pills cut out of the tinta slab at a space-7 (48px) pitch, one of them highlighted, as a pharmacist marks the line that matters
    scales: gaps space-4 (16) and space-5 (24), pill height 12 (half of radius-lg), corners radius-lg (24) and pill (half the short side)
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="tinta" x="504" y="24" width="264" height="240" rx="24"/>
    <rect class="paper" x="536" y="66" width="200" height="12" rx="6"/>
    <rect class="paper" x="536" y="114" width="152" height="12" rx="6"/>
    <rect class="hl"    x="536" y="162" width="176" height="12" rx="6"/>
    <rect class="paper" x="536" y="210" width="104" height="12" rx="6"/>
    <rect class="ink" x="784" y="24" width="152" height="112" rx="24"/>
    <rect class="hl" x="784" y="152" width="200" height="56" rx="28"/>
    <rect class="soft" x="784" y="224" width="200" height="88" rx="24"/>
  </svg>
  <p class="name">Reseta</p>
  <p class="tag">Read it right. Take it on time.</p>
</div>
</body>
</html>
